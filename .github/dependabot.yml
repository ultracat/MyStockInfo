# 워크플로의 외부 액션은 커밋 해시로 고정한다(.github/workflows/release.yml — 태그는 옮겨질 수 있어서).
# 고정한 해시가 낡지 않게 Dependabot이 새 버전을 PR로 올린다. npm 의존성은 여기서 다루지 않는다
# (electron-builder 메이저 등 직접 확인이 필요해서) — `npm audit`으로 본다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
