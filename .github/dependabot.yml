# 워크플로의 외부 액션은 커밋 해시로 고정한다(.github/workflows/release.yml — 태그는 옮겨질 수 있어서).
# 고정한 해시가 낡지 않게 Dependabot이 새 버전을 PR로 올린다.
#
# npm은 **Electron 하나만** 본다 — Electron(Chromium·V8·Node)은 보안 패치가 잦고 앱의 공격 면 대부분이라
# 패치 버전을 놓치지 않게. 나머지 npm 의존성은 `npm audit`으로 본다(electron-builder 메이저 등은 직접 확인이 필요).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: electron
    open-pull-requests-limit: 2
