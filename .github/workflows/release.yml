#  세 OS 배포용 산출물(dmg / AppImage / exe)을 각 OS의 러너에서 만든다.
#
#  왜 OS별 러너인가: Apple Silicon 맥에서 로컬 크로스 빌드는 도구 아키텍처 때문에
#  막힌다 — Windows는 rcedit가 Wine(x86_64)을 타고, Linux AppImage는 mksquashfs가
#  x86_64 바이너리라 둘 다 `bad CPU type in executable`로 죽는다. Rosetta를 까는
#  것(시스템 변경)보다 그 OS의 러너에서 빌드하는 쪽이 재현성이 좋다.
#
#  구조
#    plan (ubuntu)  고른 플랫폼만 담은 matrix JSON을 출력
#      └ package    각 OS 러너에서 npm ci → 패키징 → 아티팩트 업로드
#          └ release  태그를 ref로 수동 실행했을 때만. 산출물을 모아 **초안** 릴리스를 만든다
#
#  태그 push로는 돌지 않는다(2026-11-09) — 태그(`npm run release:tag`)와 릴리스 빌드(`npm run release:build`)를
#  따로 한다. 빌드는 `gh workflow run release.yml --ref vX.Y.Z`(태그 ref) → github.ref가 refs/tags/v…라 release 잡이 돈다.
#  브랜치(main)로 수동 실행하면 빌드만 하고 릴리스는 만들지 않는다.
#
#  릴리스를 만드는 주체는 release 잡 하나뿐이다 — electron-builder가 GH_TOKEN을
#  보고 스스로 릴리스를 만들면 세 잡이 서로 경쟁하므로 `--publish never`로 막는다.
name: release

on:
  # 수동 실행만. 태그 ref로 돌리면 빌드 + 초안 릴리스, 브랜치로 돌리면 빌드만(필요한 OS만 골라 비용·시간 절약).
  workflow_dispatch:
    inputs:
      platforms:
        description: 빌드할 플랫폼
        type: choice
        options: [all, linux, mac, windows]
        default: all

# 기본은 읽기만. 릴리스를 만드는 잡에서만 쓰기 권한을 준다.
permissions:
  contents: read

jobs:
  # 잡 단위 `if`는 matrix가 펼쳐지기 전에 평가돼서 `matrix`를 읽을 수 없다.
  # 그래서 "어떤 OS를 돌릴지"를 앞 잡에서 JSON으로 만들어 넘긴다.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        # 입력이 비면 'all'.
        run: |
          selected="${{ inputs.platforms || 'all' }}"
          all='[
            {"name":"linux","runner":"ubuntu-latest","script":"package:linux","glob":"release/*.AppImage"},
            {"name":"mac","runner":"macos-latest","script":"package:mac","glob":"release/*.dmg"},
            {"name":"windows","runner":"windows-latest","script":"package:win","glob":"release/*.exe"}
          ]'
          if [ "$selected" = "all" ]; then
            matrix=$(jq -c '.' <<<"$all")
          else
            matrix=$(jq -c --arg s "$selected" '[.[] | select(.name == $s)]' <<<"$all")
          fi
          echo "선택: $selected → $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    strategy:
      # 한 OS가 실패해도 나머지 OS의 산출물은 받는다.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 보통 10~15분. 패키징이 멈추면(서명·다운로드 대기 등) 기본 6시간 동안 러너를 붙잡지 않게.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Electron 45의 내장 Node(24.x)와 맞춘다 — 버전은 루트 .nvmrc 한 곳(Electron 메이저를 올리면 같이).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 앱 빌드에 넣는 자격증명은 없다 — Google OAuth 클라이언트와 한국수출입은행 환율 키는 사용자가 설정에서 입력한다
      # (2026-11-16, backend/src/google/clientCredentials.ts·fx/eximbankKey.ts). 예전엔 여기서 Secrets로 gitignore된
      # 파일을 만들었는데, Secrets를 등록한 적이 없어 v1.0.0~v1.2.2 배포본은 둘 다 템플릿으로 빌드됐다.

      # `--` 뒤의 인자는 스크립트 문자열 맨 끝에 붙는다. package:* 스크립트는
      # `npm run build && electron-builder --<os>`로 끝나므로 electron-builder가 받는다.
      - name: 패키징
        shell: bash
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mystock-${{ matrix.name }}
          path: ${{ matrix.glob }}
          # 산출물이 하나도 없는데 "성공"으로 끝나는 것을 막는다.
          if-no-files-found: error
          retention-days: 7

  release:
    # 태그 ref로 실행했을 때만(npm run release:build). 브랜치로 실행하면 빌드만 하고 끝난다.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 빌드 출처 증명(아래 "빌드 출처 증명") — OIDC 토큰으로 Sigstore 서명, 저장소에 증명 기록. 이 잡에만 준다.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: 받은 산출물
        run: ls -lh artifacts

      # 설치 파일 SHA-256 — 코드 서명이 없는 지금, 사용자가 받은 파일이 이 릴리스의 것인지 확인할 수 있는
      # 유일한 수단이다(README "설치"에 확인 방법). 릴리스에 같이 올라간다(아래 artifacts/*).
      - name: 체크섬(SHA256SUMS.txt)
        working-directory: artifacts
        shell: bash
        run: |
          # GitHub은 올릴 때 파일명의 공백을 .으로 바꾼다("MyStock Setup 1.2.2.exe" → "MyStock.Setup.1.2.2.exe").
          # 체크섬 파일의 이름이 사용자가 받는 이름과 같도록 먼저 바꿔 둔다.
          shopt -s nullglob
          for f in *\ *; do mv -- "$f" "${f// /.}"; done
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # 빌드 출처 증명(SLSA provenance) — "이 설치 파일이 이 저장소·이 커밋·이 워크플로에서 만들어졌다"를 Sigstore로 서명해
      # GitHub에 남긴다. 코드 서명이 없는 지금, 체크섬(같은 릴리스에 올라가 함께 바뀔 수 있다)보다 강한 확인 수단이다.
      # 대상은 위 SHA256SUMS.txt의 파일들(공백을 .으로 바꾼 뒤라 사용자가 받는 이름과 같다).
      # 확인: `gh attestation verify <받은 파일> --repo ultracat/MyStockInfo`.
      # v4부터 이 액션은 actions/attest를 감싼 것이다(동작 같음).
      - name: 빌드 출처 증명
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      # 릴리스 노트는 CHANGELOG.md의 그 버전 절("## vX.Y.Z"부터 다음 "## v" 전까지). 없으면 자동 생성 노트로.
      # (자동 생성 노트는 PR 기준이라 main에 직접 push하는 이 저장소에선 Full Changelog 한 줄뿐이다.)
      - name: 릴리스 노트 추출
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          awk -v tag="$tag" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # 이전 버전 = CHANGELOG에서 이 절 바로 다음 "## vX.Y.Z" 제목 → compare 링크. 없으면(첫 버전) commits 링크.
          prev=$(awk -v tag="$tag" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag { on = 1; next }
            on && /^## v/ { sub(/^## /, ""); sub(/ .*/, ""); print; exit }
          ' CHANGELOG.md)
          echo "" >> notes.md
          if [ -n "$prev" ] && git ls-remote --exit-code --tags origin "refs/tags/$prev" > /dev/null; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev...$tag" >> notes.md
          else
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/$tag" >> notes.md
          fi
          if [ "$(grep -c . notes.md)" -le 1 ]; then echo "::warning::CHANGELOG.md에 $tag 절이 없어 자동 생성 노트를 씁니다"; rm notes.md; fi
          [ -f notes.md ] && head -20 notes.md || true

      # 초안(draft)으로 만든다 — 되돌리기 어려운 공개 배포만 사람이 확인하고 누른다.
      - name: 초안 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            "${notes[@]}" \
            --title "MyStock ${{ github.ref_name }}" \
            artifacts/*
