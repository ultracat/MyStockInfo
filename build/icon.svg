<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    MyStock 앱 아이콘 — 단일 원천(single source of truth).
    로고를 바꾸면 이 파일(과 같은 도형을 품은 wordmark.svg)만 고치고
    `npm run generate:icons`로 icon.png / icon.icns / icon.ico /
    electron/assets/icon.png을 다시 만든다.

    읽히는 방식
      · 흰 M        = My Stock. 왼쪽보다 오른쪽 봉우리가 높은 비대칭 M이라,
                      "올랐다 → 조정받았다 → 더 올랐다"는 주가 선으로도 읽힌다.
      · M 오른쪽 기둥 + 떠 있는 초록 점 = 소문자 i (information) — "정보" 개념.
                      동시에 "현재가 데이터 포인트"로도 읽힌다.
      · 그리드 + 기준선 = 데이터·측정, 즉 정보의 바탕.

    여백은 macOS 관례(1024 캔버스에 마크 824)를 따른다 — Windows/Linux에서도
    10% 남짓 여백은 일반적이라 세 OS가 같은 PNG를 쓴다.
    색은 frontend/src/styles.css의 --series-1(파랑)·--series-3(초록) 계열.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3b8be9"/>
      <stop offset="0.55" stop-color="#2470cf"/>
      <stop offset="1" stop-color="#14509f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="184" ry="184"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <!-- 정보의 바탕: 그리드 -->
    <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round">
      <line x1="228" y1="430" x2="796" y2="430"/>
      <line x1="228" y1="545" x2="796" y2="545"/>
      <line x1="228" y1="660" x2="796" y2="660"/>
    </g>
  </g>

  <!-- 기준선(축) -->
  <line x1="228" y1="748" x2="796" y2="748" stroke="#ffffff" stroke-opacity="0.5"
        stroke-width="16" stroke-linecap="round"/>

  <!-- M = My Stock, 동시에 상승–조정–더 큰 상승의 주가 선 -->
  <path d="M248 668 L248 432 L512 592 L776 350 L776 668"
        fill="none" stroke="#ffffff" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- i의 점 = 정보(information) / 현재가 데이터 포인트 -->
  <circle cx="776" cy="212" r="48" fill="#35d49b"/>
</svg>
